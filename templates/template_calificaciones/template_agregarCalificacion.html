<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingresar Calificación</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background-color: #FFF3E0; }
    .orange-bar {
      background: #FF9800;
      height: 8px;
      width: 100%;
      border-radius: 3px 3px 0 0;
      margin-bottom: 1px;
    }
    h4 {
      color: #FF9800;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 16px;
    }
    label {
      font-weight: 500;
      color: #F57C00;
    }
    .form-control.bg-orange {
      background-color: #FFF8E1;
      border: 1px solid #FF9800;
    }
    .form-control:disabled {
      background-color: #FFE0B2 !important;
      color: #6c757d;
    }
    .btn-orange {
      background-color: #FF9800;
      color: #fff;
      border: none;
    }
    .btn-orange:hover {
      background-color: #F57C00;
    }
    .btn-outline-orange {
      border: 1px solid #FF9800;
      color: #FF9800;
    }
    .btn-outline-orange:hover {
      background-color: #FF9800;
      color: #fff;
    }
    .card {
      border-top: 8px solid #FF9800;
      border-radius: 8px;
      background: #fff;
    }
  </style>
</head>

<body>

<div class="container mt-4">
  <div class="card p-4 shadow">
    <div class="orange-bar"></div>

    <h4>Ingresar Calificación</h4>

    <!-- 🔥 FORMULARIO REAL PARA DJANGO -->
    <form method="POST">
      {% csrf_token %}

      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label">Mercado</label>
          <input type="text" name="mercado" class="form-control bg-orange" value="ACCIONES" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Instrumento</label>
          <input type="text" name="instrumento" class="form-control bg-orange" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Factor Actualización</label>
          <input type="number" name="factor_actualizado" class="form-control bg-orange" step="0.00000001" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label">Descripción</label>
          <input type="text" name="descripcion" class="form-control bg-orange" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Fecha de Pago</label>
          <input type="date" name="fecha" class="form-control bg-orange" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Año</label>
          <input type="number" name="ano" class="form-control bg-orange" value="2025" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label">Secuencia Evento</label>
          <input type="text" name="secuencia" class="form-control bg-orange">
        </div>

        <div class="col-md-4">
          <label class="form-label">Dividendo</label>
          <input type="number" name="dividendo" class="form-control bg-orange" step="0.000001" value="0">
        </div>

        <div class="col-md-4 d-flex align-items-end">
          <div class="form-check mt-3">
            <input class="form-check-input" type="checkbox" name="isfut" id="isfut">
            <label class="form-check-label" for="isfut">ISFUT</label>
          </div>
        </div>
      </div>

      <div class="row mb-4">
        <div class="col-md-4">
          <label class="form-label">Valor Histórico</label>
          <input type="number" name="valor_historico" class="form-control bg-orange" step="0.00000001" value="0">
        </div>
      </div>

      <div class="d-flex justify-content-end">

        <!-- Cancelar -->
        <a href="{% url 'perfil_usuario' %}" class="btn btn-outline-orange me-3">
          CANCELAR
        </a>

        <!-- Ingresar -->
        <button type="submit" class="btn btn-orange">
          INGRESAR
        </button>

      </div>

    </form>

  </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del Corredor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #FFF3E0;
        }
        .barra-naranja {
            background: #FF9800;
            height: 8px;
            width: 100%;
            border-radius: 4px 4px 0 0;
            margin-bottom: 2px;
        }
        h4 {
            color: #FF9800;
            font-weight: bold;
        }
        .card {
            border-top: 8px solid #FF9800;
            border-radius: 8px;
        }
        .btn-orange {
            background-color: #FF9800;
            border: none;
            color: #fff;
            font-weight: 500;
        }
        .btn-orange:hover {
            background-color: #F57C00;
            color: #fff;
        }
        .btn-outline-orange {
            border: 1px solid #FF9800;
            color: #FF9800;
            background: #fff;
            font-weight: 500;
        }
        .btn-outline-orange:hover {
            background-color: #FF9800;
            color: #fff;
        }
        .menu-btn {
            width: 100%;
            text-align: left;
            margin-bottom: 10px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
        }
        .bienvenido {
            color: #FF9800;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <div class="card shadow">
        <div class="barra-naranja"></div>

        <!-- BARRA SUPERIOR -->
        <div class="top-bar">
            <div class="bienvenido">
                Bienvenido, <span>{{ request.user.username }}</span>
            </div>

            <a href="{% url 'logout' %}" class="btn btn-outline-orange">
                Cerrar Sesión
            </a>
        </div>

        <div class="p-4">
            <h4 class="mb-4">Panel Principal del Corredor</h4>

            <div class="row">
                <div class="col-md-6">
                    <a href="{% url 'mantenedor_montos' %}" class="btn btn-outline-orange menu-btn">Mantenedor de Montos</a>
                    <a href="{% url 'mantenedor_factores' %}" class="btn btn-outline-orange menu-btn">Mantenedor de Factores</a>
                    <a href="{% url 'calificaciones_no_inscritas' %}" class="btn btn-outline-orange menu-btn">Calificaciones No Inscritas</a>
                </div>

                <div class="col-md-6">
                    <a href="{% url 'carga_masiva' %}" class="btn btn-outline-orange menu-btn">Carga Masiva</a>
                    <a href="{% url 'carga_externa' %}" class="btn btn-outline-orange menu-btn">Carga Externa</a>
                    <a href="{% url 'perfil_usuario' %}" class="btn btn-orange menu-btn">Ver Mis Calificaciones</a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>

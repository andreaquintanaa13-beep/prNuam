{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carga Masiva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .barra-naranja {
            height: 8px;
            background-color: #ff7b00;
            border-radius: 4px 4px 0 0;
            margin-bottom: 15px;
        }

        .btn-orange {
            background-color: #ff7b00;
            color: white;
            font-weight: bold;
        }

        .btn-orange:hover {
            background-color: #e56f00;
            color: white;
        }

        .btn-outline-orange {
            border: 2px solid #ff7b00;
            color: #ff7b00;
            font-weight: bold;
        }

        .btn-outline-orange:hover {
            background-color: #ff7b00;
            color: white;
        }
    </style>
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4">Carga Masiva</h2>

    <div class="card shadow-sm">
        <div class="barra-naranja"></div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold">Seleccionar archivo Excel:</label>
                    <input type="file" name="archivo" class="form-control" required>
                </div>

                {% if mensaje %}
                <div class="alert alert-info">{{ mensaje }}</div>
                {% endif %}

                <div class="d-flex justify-content-between">
                    <button class="btn btn-orange">Procesar Archivo</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-orange">Cancelar</a>
                </div>
            </form>

        </div>
    </div>

</div>

</body>
</html>

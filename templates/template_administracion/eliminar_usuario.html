<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #FFF3E0; }
        .card-confirm {
            max-width: 450px;
            margin: 60px auto;
            padding: 25px;
            background: white;
            border-top: 6px solid #D32F2F;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(211,47,47,0.2);
        }
    </style>
</head>
<body>

<div class="card-confirm">
    <h3 class="text-center text-danger">Confirmar eliminación</h3>
    <p class="mt-3">¿Seguro que deseas eliminar al usuario <b>{{ usuario.nombre }}</b>?</p>

    <form method="POST">
        {% csrf_token %}
        <div class="d-flex justify-content-between mt-4">
            <a href="{% url 'perfil_administrador' %}" class="btn btn-secondary">Cancelar</a>
            <button class="btn btn-danger">Eliminar</button>
        </div>
    </form>
</div>

</body>
</html>

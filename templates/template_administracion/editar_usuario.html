{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #FFF3E0;
        }
        .card-edit {
            margin: 40px auto;
            max-width: 500px;
            padding: 25px;
            border-radius: 12px;
            border-top: 6px solid #FF9800;
            background: white;
            box-shadow: 0 4px 20px rgba(255,152,0,0.2);
        }
        .btn-orange {
            background: #FF9800;
            color: white;
        }
        .btn-orange:hover {
            background: #F57C00;
        }
    </style>
</head>
<body>

<div class="card-edit">
    <h3 class="text-center">Editar Usuario</h3>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" value="{{ usuario.nombre }}" disabled>
        </div>

        <div class="mb-3">
            <label class="form-label">Rol</label>
            <select class="form-select" name="rol">
                <option value="administrador" {% if usuario.rol == "administrador" %}selected{% endif %}>Administrador</option>
                <option value="corredor" {% if usuario.rol == "corredor" %}selected{% endif %}>Corredor</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Estado</label>
            <select class="form-select" name="estado">
                <option value="activo" {% if usuario.estado == "activo" %}selected{% endif %}>Activo</option>
                <option value="pendiente" {% if usuario.estado == "pendiente" %}selected{% endif %}>Pendiente</option>
                <option value="inactivo" {% if usuario.estado == "inactivo" %}selected{% endif %}>Inactivo</option>
            </select>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{% url 'perfil_administrador' %}" class="btn btn-outline-secondary">Volver</a>
            <button type="submit" class="btn btn-orange">Guardar Cambios</button>
        </div>
    </form>
</div>

</body>
</html>

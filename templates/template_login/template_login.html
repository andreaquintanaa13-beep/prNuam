<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Sistema NUAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(120deg, #FFB74D 0%, #FFF3E0 100%);
      min-height: 100vh;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 28px rgba(255, 152, 0, 0.15);
      border-top: 8px solid #FF9800;
      max-width: 400px;
      margin: 60px auto;
      padding: 32px 32px 24px 32px;
    }
    .login-title {
      color: #FF9800;
      font-weight: bold;
      margin-bottom: 30px;
      text-align: center;
    }
    .form-label {
      color: #F57C00;
      font-weight: 500;
    }
    .btn-orange {
      background-color: #FF9800;
      color: #fff;
      border: none;
      width: 100%;
      font-weight: 500;
      margin-top: 8px;
    }
    .btn-orange:hover {
      background-color: #F57C00;
      color: #fff;
    }
    .login-footer {
      margin-top: 18px;
      text-align: center;
      color: #F57C00;
    }
    .error-msg {
      background: #ffdbcc;
      padding: 10px;
      border-radius: 6px;
      color: #b7321f;
      font-weight: 500;
      margin-bottom: 15px;
      text-align: center;
    }
    .form-control:focus {
      border-color: #FF9800;
      box-shadow: 0 0 0 0.2rem rgba(255,152,0,.25);
    }
  </style>
</head>

<body>
  <div class="login-card">

    <div class="login-title">Iniciar Sesión</div>

    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <div class="mb-3">
        <label for="usuario" class="form-label">Correo</label>
        <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Ingrese su correo">
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Ingrese su contraseña">
      </div>

      <button type="submit" class="btn btn-orange">Acceder</button>

    </form>

    <div class="login-footer">
      ¿No tienes cuenta? <a href="{% url 'registrarse' %}" style="color:#F57C00;">Regístrate aquí</a>
    </div>

  </div>
</body>
<script>
  document.getElementById("usuario").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
          event.preventDefault();  
          document.getElementById("password").focus(); // Enfocar contraseña
      }
  });


  document.getElementById("password").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
          event.preventDefault();
          document.querySelector("form").submit();
      }
  });
</script>
</html>

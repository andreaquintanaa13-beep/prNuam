<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - Sistema NUAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(120deg, #FFB74D 0%, #FFF3E0 100%);
      min-height: 100vh;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 28px rgba(255, 152, 0, 0.15);
      border-top: 8px solid #FF9800;
      max-width: 400px;
      margin: 60px auto;
      padding: 32px;
    }
    .login-title {
      color: #FF9800;
      font-weight: bold;
      margin-bottom: 30px;
      text-align: center;
    }
    .form-label {
      color: #F57C00;
      font-weight: 500;
    }
    .btn-orange {
      background-color: #FF9800;
      color: #fff;
      width: 100%;
      font-weight: 500;
    }
    .btn-orange:hover {
      background-color: #F57C00;
      color: #fff;
    }
    .message {
      text-align: center;
      color: green;
      margin-top: 10px;
      font-weight: 500;
    }
    .form-control:focus {
      border-color: #FF9800;
      box-shadow: 0 0 0 0.2rem rgba(255,152,0,.25);
    }
  </style>
</head>

<body>
  <div class="login-card">

    <div class="login-title">Registrarse</div>

    {% if mensaje %}
      <p class="message">{{ mensaje }}</p>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" name="nombre" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Correo</label>
        <input type="email" class="form-control" name="correo" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" name="password" required>
      </div>

      <button type="submit" class="btn btn-orange">Enviar registro</button>
    </form>

    <div style="text-align:center;margin-top:20px;color:#F57C00;">
      ¿Ya tienes cuenta?  
      <a href="{% url 'login' %}" style="color:#F57C00;">Inicia sesión</a>
    </div>

  </div>
</body>
</html>

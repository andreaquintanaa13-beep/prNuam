<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carga por Factor</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background-color: #FFF8F2; }
    .btn-orange { background-color: #FF9800; border: none; color: white; }
    .btn-orange:hover { background-color: #FB8C00; }
    .btn-outline-orange { border: 1px solid #FF9800; color: #FF9800; }
    .btn-outline-orange:hover { background-color: #FF9800; color: white; }
  </style>
</head>

<body>

<div class="container mt-4">

    <h4 class="mb-3" style="color:#FF9800; font-weight:bold;">Carga por Factor</h4>

    <form method="POST" enctype="multipart/form-data" class="p-3 border rounded bg-white shadow-sm">
        {% csrf_token %}

        <label class="form-label">Seleccionar archivo CSV / XLSX</label>
        <input type="file" name="archivo" class="form-control mb-3" required>

        <div class="d-flex justify-content-end">
            <a href="{% url 'perfil_usuario' %}" class="btn btn-outline-orange me-2">Cancelar</a>
            <button type="submit" class="btn btn-orange">Cargar</button>
        </div>
    </form>

    {% if mensaje %}
    <div class="alert alert-info mt-3">
        {{ mensaje }}
    </div>
    {% endif %}

</div>

</body>
</html>

{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del Administrador</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<!-- TOP BAR -->
<div class="container mt-3">
    <div class="d-flex justify-content-between align-items-center">
        <strong class="fs-5">Bienvenido, {{ nombre_usuario }}</strong>

        <a href="{% url 'logout' %}" class="btn btn-outline-danger">
            Cerrar sesión
        </a>
    </div>
</div>

<!-- MAIN CARD -->
<div class="container mt-4 p-4 bg-white rounded shadow-sm">

    <h2 class="text-center mb-4">Administración</h2>

    <!-- Menú de administración -->
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
            <a class="nav-link" href="{% url 'perfil_administrador' %}">Gestión de Usuarios</a>
        </li>

        <li class="nav-item">
        <!--  <a class="nav-link" href="{% url 'permisos' %}">Permisos</a>--> 
        </li>

    </ul>

    <!-- Contenido dinámico (auditoría por defecto) -->
    {% block contenido_admin %}
    <p>Selecciona una opción del menú para administrar.</p>
    {% endblock %}

</div>

</body>
</html>
